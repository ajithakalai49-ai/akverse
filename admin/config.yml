backend:
  name: github
  repo: ajithakalai49-ai/akverse
  branch: main

media_folder: /assets/uploads
public_folder: /assets/uploads

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home Page
        file: content/home.yml
        format: yaml

        fields:
          - name: welcome_title
            label: Welcome Title
            widget: string

          - name: welcome_description
            label: Welcome Description
            widget: text

          - name: hero_image
            label: Hero Image
            widget: image
            required: false

          - name: about_title
            label: About Title
            widget: string

          - name: about_description
            label: About Description
            widget: richtext

          - name: sections
            label: Website Sections
            widget: list
            summary: "{{fields.title}}"
            fields:
              - name: title
                label: Section Title
                widget: string

              - name: description
                label: Section Description
                widget: richtext

              - name: image
                label: Section Image
                widget: image
                required: false

              - name: button_text
                label: Button Text
                widget: string
                required: false

              - name: button_link
                label: Button Link
                widget: string
                required: false
